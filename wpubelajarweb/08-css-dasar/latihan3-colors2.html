<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quote Galau</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Cinzel:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #f8ece6;
      --blush: #efd2d0;
      --rose: #dba9ad;
      --red-deep: #5c0a14;
      --red-main: #7d1128;
      --red-soft: #a3485a;
      --gold: #b8895a;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      box-sizing: border-box;
      color: var(--red-main);
      text-align: center;
      font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(163, 72, 90, 0.35), transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(125, 17, 40, 0.30), transparent 50%),
        linear-gradient(160deg, var(--cream) 0%, var(--blush) 55%, var(--rose) 100%);
      background-attachment: fixed;
    }

    /* vignette: tepi layar menggelap */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(92, 10, 20, 0.35) 100%);
    }

    /* tekstur grain halus */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.12;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.36  0 0 0 0 0.04  0 0 0 0 0.08  0 0 0 0.9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    /* kartu utama */
    .card {
      position: relative;
      z-index: 1;
      max-width: 620px;
      width: 100%;
      padding: clamp(32px, 6vw, 60px) clamp(22px, 5vw, 50px);
      box-sizing: border-box;
      background: rgba(255, 248, 244, 0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(125, 17, 40, 0.30);
      box-shadow:
        0 20px 50px rgba(92, 10, 20, 0.25),
        inset 0 0 0 8px rgba(255, 248, 244, 0.35),
        inset 0 0 0 9px rgba(184, 137, 90, 0.45);
      animation: fade 1.4s ease both;
    }

    h1 {
      margin: 0 0 10px;
      font-family: 'Cinzel', Georgia, serif;
      font-weight: 500;
      font-size: clamp(30px, 7vw, 52px);
      text-transform: uppercase;
      letter-spacing: 0.35em;
      padding-left: 0.35em;
      background: linear-gradient(90deg, var(--red-deep), var(--red-soft), var(--red-deep));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(2px 2px 0 rgba(125, 17, 40, 0.15));
      animation: fade 1.6s ease both;
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 18px 0 34px;
      font-size: 22px;
      color: var(--gold);
      animation: fade 1.6s ease 0.3s both;
    }

    .divider::before,
    .divider::after {
      content: "";
      width: 70px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .quote {
      margin: 0;
      font-size: clamp(19px, 3.4vw, 27px);
      font-style: italic;
      font-weight: 500;
      line-height: 2;
      letter-spacing: 0.5px;
      color: var(--red-main);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
      animation: fade 1.8s ease 0.6s both;
    }

    .quote span {
      color: var(--red-soft);
      text-decoration: line-through;
      text-decoration-thickness: 1px;
      opacity: 0.8;
    }

    .credit {
      margin: 36px 0 0;
      font-family: 'Cinzel', Georgia, serif;
      font-size: 13px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--red-soft);
      animation: fade 2s ease 1s both;
    }

    @keyframes fade {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

  <main class="card">
    <h1>drop dead</h1>

    <div class="divider">❦</div>

    <p class="quote">
    Pisces and a Gemini <br>
    But I think we might <br>
    Go really nice together <br>
    If you let me stay the night<br>
    Well I think I <span>might</span> <br>
    Just have to stay forever <br>
  </p>

    <p class="credit">— olivia rodrigo</p>
  </main>

</body>

</html>
