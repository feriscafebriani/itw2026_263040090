<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quote Galau</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Cinzel:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --red-deep: #5c0a14;
      --red-main: #7d1128;
      --red-soft: #a3485a;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      box-sizing: border-box;
      background: transparent;
      color: var(--red-main);
      text-align: center;
      font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    }

    h1 {
      margin: 0 0 10px;
      font-family: 'Cinzel', Georgia, serif;
      font-weight: 500;
      font-size: clamp(32px, 7vw, 56px);
      text-transform: uppercase;
      letter-spacing: 0.35em;
      padding-left: 0.35em; /* menyeimbangkan letter-spacing */
      color: var(--red-deep);
      text-shadow: 2px 2px 0 rgba(125, 17, 40, 0.15);
      animation: fade 1.6s ease both;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 18px 0 34px;
      color: var(--red-soft);
      animation: fade 1.6s ease 0.3s both;
    }

    .divider::before,
    .divider::after {
      content: "";
      width: 70px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--red-soft), transparent);
    }

    .quote {
      max-width: 560px;
      margin: 0;
      font-size: clamp(20px, 3.4vw, 28px);
      font-style: italic;
      font-weight: 500;
      line-height: 2;
      letter-spacing: 0.5px;
      color: var(--red-main);
      animation: fade 1.8s ease 0.6s both;
    }

    .quote span {
      color: var(--red-soft);
      text-decoration: line-through;
      text-decoration-thickness: 1px;
      opacity: 0.8;
    }

    .credit {
      margin-top: 36px;
      font-family: 'Cinzel', Georgia, serif;
      font-size: 13px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--red-soft);
      animation: fade 2s ease 1s both;
    }

    @keyframes fade {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

  <h1>drop dead</h1>

  <div class="divider">❦</div>

  <p class="quote">
    Pisces and a Gemini <br>
    But I think we might <br>
    Go really nice together <br>
    If you let me stay the night<br>
    Well I think I <span>might</span> <br>
    Just have to stay forever <br>
  </p>

  <p class="credit">— olivia rodrigo</p>

</body>

</html>
