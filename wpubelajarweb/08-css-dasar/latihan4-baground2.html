<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quote Galau</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Cinzel:wght@500&display=swap" rel="stylesheet">
  <style>
  :root {
    --bg-base: #1a0509;
    --cream: #f7e9ec;
    --rose: #e8a0ad;
    --red-glow: #ff4d6d;
    --red-deep: #7d1128;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    box-sizing: border-box;
    text-align: center;
    color: var(--cream);
    font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;

    /* konsep sama seperti sebelumnya: warna dasar + overlay gradasi + foto fixed */
    background-color: var(--bg-base);
    background-image:
      linear-gradient(to bottom, rgb(26 5 9 / 92%) 50%, rgb(92 10 20 / 55%)),
      url('https://picsum.photos/id/10/1000/1000');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
  }

  h1 {
    margin: 0 0 10px;
    font-family: 'Cinzel', Georgia, serif;
    font-weight: 500;
    font-size: clamp(32px, 7vw, 56px);
    text-transform: uppercase;
    letter-spacing: 0.35em;
    padding-left: 0.35em; /* menyeimbangkan letter-spacing */

    /* teks gradasi krem -> merah muda, dengan glow merah */
    background-image: linear-gradient(to right, #fff1f3 20%, var(--red-glow));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 12px rgb(255 77 109 / 45%));
    animation: fade 1.6s ease both;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 18px 0 34px;
    color: var(--rose);
    text-shadow: 0 0 10px rgb(255 77 109 / 60%);
    animation: fade 1.6s ease 0.3s both;
  }

  .divider::before,
  .divider::after {
    content: "";
    width: 70px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--rose), transparent);
  }

  /* kartu kaca, sama seperti kode sebelumnya */
  .quote {
    max-width: 560px;
    margin: 0;
    padding: 40px;
    font-size: clamp(20px, 3.4vw, 28px);
    font-style: italic;
    font-weight: 500;
    line-height: 2;
    letter-spacing: 0.5px;
    color: var(--cream);
    background-color: rgb(255 255 255 / 5%);
    border: 1px solid rgb(255 255 255 / 10%);
    border-radius: 20px;
    box-shadow: 0 10px 30px rgb(0 0 0 / 50%);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    animation: fade 1.8s ease 0.6s both;
  }

  .quote span {
    color: var(--red-glow);
    text-decoration: line-through;
    text-decoration-thickness: 1px;
    text-shadow: 0 0 10px rgb(255 77 109 / 70%);
  }

  .credit {
    margin-top: 36px;
    padding-top: 20px;
    width: 120px;
    border-top: 1px solid rgb(255 255 255 / 20%);
    font-family: 'Cinzel', Georgia, serif;
    font-size: 13px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: rgb(232 160 173 / 80%);
    animation: fade 2s ease 1s both;
  }

  @keyframes fade {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>

<body>

  <h1>drop dead</h1>

  <div class="divider">❦</div>

  <p class="quote">
    Pisces and a Gemini <br>
    But I think we might <br>
    Go really nice together <br>
    If you let me stay the night<br>
    Well I think I <span>might</span> <br>
    Just have to stay forever <br>
  </p>

  <p class="credit">— olivia rodrigo</p>

</body>

</html>
